[Metadata]
Name=wechat-light
Name[zh_CN]=微信浅色
Version=1.10
Author=rime-ice
Description=微信输入法风格 · 浅色模式（白底、亮翠绿高亮、SVG 矢量大圆角、无边框）
ScaleWithDPI=True

[InputPanel]
# 普通候选项文字颜色：黑色
NormalColor=#000000
# 高亮候选文字颜色：白色
HighlightCandidateColor=#FFFFFF
# 高亮前景（预编辑字符）：白色
HighlightColor=#FFFFFF
# 高亮背景：亮翠绿 #34B950
HighlightBackgroundColor=#34B950
# 竖排列表时使用所有横向空间高亮（保持横排单行）
FullWidthHighlight=True

[InputPanel/TextMargin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=4
Right=4
Top=6
Bottom=6

# 候选弹窗背景：白色 SVG 圆角、无边框
[InputPanel/Background]
Image=panel.svg
Color=#FFFFFF
BorderColor=#FFFFFF00
BorderWidth=0

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

# 高亮圆角色块：亮翠绿 SVG 圆角、无边框
[InputPanel/Highlight]
Image=highlight.svg
Color=#34B950
BorderColor=#FFFFFF00
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu]
NormalColor=#000000
HighlightCandidateColor=#FFFFFF
HighlightColor=#FFFFFF
HighlightBackgroundColor=#34B950

[Menu/Background]
Image=panel.svg
Color=#FFFFFF
BorderColor=#FFFFFF00
BorderWidth=0

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
Left=4
Right=4
Top=6
Bottom=6

[Menu/Highlight]
Image=highlight.svg
Color=#34B950
BorderColor=#FFFFFF00
BorderWidth=0

[Menu/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/Separator]
Color=#E8E8E8

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
