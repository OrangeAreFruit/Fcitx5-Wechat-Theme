[Metadata]
Name=wechat-dark
Name[zh_CN]=微信深色
Version=1.10
Author=rime-ice
Description=微信输入法风格 · 深色夜间模式（深色半透明 SVG 背景、压暗翠绿高亮、矢量大圆角、无边框）
ScaleWithDPI=True

[InputPanel]
# 普通候选项文字颜色：白色
NormalColor=#FFFFFF
# 高亮候选文字颜色：白色
HighlightCandidateColor=#FFFFFF
# 高亮前景（预编辑字符）：白色
HighlightColor=#FFFFFF
# 高亮背景：压暗翠绿 #279E42
HighlightBackgroundColor=#279E42
FullWidthHighlight=True

[InputPanel/TextMargin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=4
Right=4
Top=6
Bottom=6

# 候选弹窗背景：深色半透明 SVG 圆角、无边框
[InputPanel/Background]
Image=panel.svg
Color=#1E1E20
BorderColor=#FFFFFF00
BorderWidth=0

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

# 高亮圆角色块：压暗翠绿 SVG 圆角、无边框
[InputPanel/Highlight]
Image=highlight.svg
Color=#279E42
BorderColor=#FFFFFF00
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu]
NormalColor=#FFFFFF
HighlightCandidateColor=#FFFFFF
HighlightColor=#FFFFFF
HighlightBackgroundColor=#279E42

[Menu/Background]
Image=panel.svg
Color=#1E1E20
BorderColor=#FFFFFF00
BorderWidth=0

[Menu/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/ContentMargin]
Left=4
Right=4
Top=6
Bottom=6

[Menu/Highlight]
Image=highlight.svg
Color=#279E42
BorderColor=#FFFFFF00
BorderWidth=0

[Menu/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/Separator]
Color=#3A3A3C

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
