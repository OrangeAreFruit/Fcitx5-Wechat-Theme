<svg xmlns="http://www.w3.org/2000/svg" width="320" height="54">
  <defs>
    <filter id="shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="30"/>
      <feOffset dx="0" dy="4"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="320" height="54" rx="10" ry="10" fill="#FFFFFF" filter="url(#shadow)"/>
</svg>
